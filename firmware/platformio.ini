[platformio]
src_dir = .
default_envs = esp32-c3-button

; Shared by every environment below.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
  framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
; upload_port = COM19
; monitor_port = COM19
monitor_speed = 115200

; Main firmware: wheel, button, OLED, optional GPS and charger; radio off.
[env:esp32-c3-button]
build_src_filter = +<button_led.cpp>
lib_deps =
  adafruit/Adafruit NeoPixel
  olikraus/U8g2
  mikalhart/TinyGPSPlus

[env:esp32-c3-button-diagnostics]
extends = env:esp32-c3-button
build_flags =
  ${env.build_flags}
  -DLED_DIAGNOSTICS=1

; Phone control through the board's own Wi-Fi access point (android/ app).
[env:esp32-c3-wifi]
build_src_filter = +<wifi_led.cpp>
lib_deps =
  adafruit/Adafruit NeoPixel

[env:esp32-c3-wifi-diagnostics]
extends = env:esp32-c3-wifi
build_flags =
  ${env.build_flags}
  -DLED_DIAGNOSTICS=1

; Board self-test over USB serial (see docs/DIAGNOSTICS.md).
[env:esp32-c3-board-diag]
build_src_filter = +<board_diag.cpp>
