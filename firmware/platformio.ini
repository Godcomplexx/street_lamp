[platformio]
src_dir = .
default_envs = esp32-c3-wifi

[env:esp32-c3-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
  framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
build_src_filter = +<esp32_c3_button_led.ino*>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
; upload_port = COM19
; monitor_port = COM19
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel

[env:esp32-c3-diagnostics]
extends = env:esp32-c3-mini
build_flags =
  ${env:esp32-c3-mini.build_flags}
  -DLED_DIAGNOSTICS=1

[env:esp32-c3-coded-diagnostics]
extends = env:esp32-c3-ble5-diagnostics
build_flags =
  ${env:esp32-c3-ble5-diagnostics.build_flags}
  -DLED_CODED_PHY=1

[env:esp32-c3-visibility-probe]
extends = env:esp32-c3-diagnostics
build_flags =
  ${env:esp32-c3-diagnostics.build_flags}
  -DLED_VISIBILITY_PROBE=1

[env:esp32-c3-ble-probe]
extends = env:esp32-c3-mini
build_src_filter = +<ble_probe.cpp>

[env:esp32-c3-legacy]
extends = env:esp32-c3-mini
platform = espressif32@6.13.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212
  espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@2.41100.0

[env:esp32-c3-legacy-diagnostics]
extends = env:esp32-c3-legacy
build_flags =
  ${env:esp32-c3-legacy.build_flags}
  -DLED_DIAGNOSTICS=1

[env:esp32-c3-rx-probe]
extends = env:esp32-c3-legacy
build_src_filter = +<ble_rx_probe.cpp>

[env:esp32-c3-wifi-rx-probe]
extends = env:esp32-c3-mini
build_src_filter = +<wifi_rx_probe.cpp>

[env:esp32-c3-nimble-probe]
extends = env:esp32-c3-mini
build_src_filter = +<nimble_probe.cpp>
lib_deps =
  adafruit/Adafruit NeoPixel
  h2zero/NimBLE-Arduino@2.5.1

[env:esp32-c3-extended-probe]
extends = env:esp32-c3-nimble-probe
build_flags =
  ${env:esp32-c3-mini.build_flags}
  -DCONFIG_BT_NIMBLE_EXT_ADV=1

[env:esp32-c3-ble5]
extends = env:esp32-c3-mini
; The sketch also has a legacy branch; do not link its built-in BLE stack here.
lib_ignore = BLE
lib_deps =
  ${env:esp32-c3-nimble-probe.lib_deps}
build_flags =
  ${env:esp32-c3-mini.build_flags}
  -DLED_STANDALONE_NIMBLE=1
  -DCONFIG_BT_NIMBLE_EXT_ADV=1

[env:esp32-c3-ble5-diagnostics]
extends = env:esp32-c3-ble5
build_flags =
  ${env:esp32-c3-ble5.build_flags}
  -DLED_DIAGNOSTICS=1

; Main firmware: the phone connects to the board's own Wi-Fi access point.
[env:esp32-c3-wifi]
extends = env:esp32-c3-mini
build_src_filter = +<wifi_led.cpp>

[env:esp32-c3-wifi-diagnostics]
extends = env:esp32-c3-wifi
build_flags =
  ${env:esp32-c3-wifi.build_flags}
  -DLED_DIAGNOSTICS=1

; Wi-Fi transmit check through ESP-IDF directly: open AP "C3OPEN", channel 1, 802.11b.
[env:esp32-c3-ap-probe]
extends = env:esp32-c3-mini
build_src_filter = +<wifi_ap_probe.cpp>
lib_deps =

[env:esp32-c3-ap-probe-legacy]
extends = env:esp32-c3-legacy
build_src_filter = +<wifi_ap_probe.cpp>
lib_deps =

; Board self-test over USB serial (see board_diag.cpp).
[env:esp32-c3-board-diag]
extends = env:esp32-c3-mini
build_src_filter = +<board_diag.cpp>
lib_deps =

; Button and LED only, radio off: for this board, whose crystal is +182 ppm off.
[env:esp32-c3-button]
extends = env:esp32-c3-mini
build_src_filter = +<button_led.cpp>

[env:esp32-c3-button-diagnostics]
extends = env:esp32-c3-button
build_flags =
  ${env:esp32-c3-button.build_flags}
  -DLED_DIAGNOSTICS=1
